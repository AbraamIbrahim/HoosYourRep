name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VA-Rep-Tracker/package-lock.json
      - run: npm ci
        working-directory: VA-Rep-Tracker
      - run: npm test
        working-directory: VA-Rep-Tracker
      - run: npm run lint
        working-directory: VA-Rep-Tracker
      - run: npm run build
        working-directory: VA-Rep-Tracker
